services:
  - type: web
    name: shtatkontrol-backend
    runtime: node
    plan: free
    buildCommand: npm install && npx prisma generate && npx prisma migrate deploy
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 18.19.0
      - key: DATABASE_URL
        value: file:./prisma/data.db
    disk:
      name: data
      mountPath: /opt/render/project/src/prisma
      sizeGB: 1